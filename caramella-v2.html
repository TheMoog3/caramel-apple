<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Shell</title>

  <style>
    :root {
      --bg: #111;
      --panel: #1b1b1b;
      --accent: #283335;
      --text: #FAFAD2;
      --danger: #ff6b6b;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 8px;
      background: var(--panel);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"] {
      padding: 6px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--accent);
    }

    button {
      background: var(--accent);
      color: var(--text);
      border: none;
      padding: 6px 10px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      background: #151515;
      overflow-x: auto;
    }

    .tab {
      padding: 6px 10px;
      cursor: pointer;
      border-right: 1px solid #222;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab.active {
      background: var(--accent);
    }

    .tab button {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
    }

    .frames {
      position: relative;
      flex: 1;
    }

    .frames iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .frames iframe.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <h2>Launcher</h2>
  <button onclick="openShell()">Open Shell</button>

<script>
function sanitizeUrl(input) {
  try {
    let url = input.trim();
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return new URL(url).href;
  } catch {
    return null;
  }
}

function openShell() {
  const win = window.open("", "_blank");
  if (!win) return alert("Popup blocked");

  win.document.title = "Tab Shell";
  win.document.body.innerHTML = "";

  const style = win.document.createElement("style");
  style.textContent = document.querySelector("style").textContent;
  win.document.head.appendChild(style);

  const topbar = win.document.createElement("div");
  topbar.className = "topbar";

  const urlInput = win.document.createElement("input");
  urlInput.type = "text";
  urlInput.placeholder = "URL";

  const titleInput = win.document.createElement("input");
  titleInput.type = "text";
  titleInput.placeholder = "Title";

  const addBtn = win.document.createElement("button");
  addBtn.textContent = "Add Tab";

  const splitBtn = win.document.createElement("button");
  splitBtn.textContent = "Split";

  const fsBtn = win.document.createElement("button");
  fsBtn.textContent = "Fullscreen";

  const tabsBar = win.document.createElement("div");
  tabsBar.className = "tabs";

  const frames = win.document.createElement("div");
  frames.className = "frames";

  win.document.body.appendChild(topbar);
  win.document.body.appendChild(tabsBar);
  win.document.body.appendChild(frames);

  topbar.appendChild(urlInput);
  topbar.appendChild(titleInput);
  topbar.appendChild(addBtn);
  topbar.appendChild(splitBtn);
  topbar.appendChild(fsBtn);

  let tabs = [];
  let active = -1;
  let splitMode = false;

  function renderTabs() {
    tabsBar.innerHTML = "";

    tabs.forEach((t, i) => {
      const tab = win.document.createElement("div");
      tab.className = "tab" + (i === active ? " active" : "");

      tab.textContent = t.title;
      tab.onclick = () => switchTab(i);

      const close = win.document.createElement("button");
      close.textContent = "x";
      close.onclick = (e) => {
        e.stopPropagation();
        closeTab(i);
      };

      tab.appendChild(close);
      tabsBar.appendChild(tab);
    });
  }

  function renderFrames() {
    if (!splitMode) {
      frames.className = "frames";

      tabs.forEach((t, i) => {
        t.frame.classList.toggle("hidden", i !== active);
        if (!frames.contains(t.frame)) frames.appendChild(t.frame);
      });
    } else {
      frames.innerHTML = "";
      frames.className = "frames split";

      const a = tabs[active];
      const b = tabs[active + 1] || tabs[active];

      if (a) frames.appendChild(a.frame);
      if (b && b !== a) frames.appendChild(b.frame);
    }
  }

  function switchTab(i) {
    if (i < 0 || i >= tabs.length) return;
    active = i;
    renderTabs();
    renderFrames();
  }

  function closeTab(i) {
    tabs[i].frame.remove();
    tabs.splice(i, 1);

    if (tabs.length === 0) {
      active = -1;
      renderTabs();
      renderFrames();
      return;
    }

    if (i === active) active = Math.max(0, i - 1);
    else if (i < active) active--;

    renderTabs();
    renderFrames();
  }

  function addTab() {
    const url = sanitizeUrl(urlInput.value);
    if (!url) return alert("Invalid URL");

    const frame = win.document.createElement("iframe");
    frame.src = url;

    tabs.push({
      title: titleInput.value || new URL(url).hostname,
      frame
    });

    active = tabs.length - 1;

    renderTabs();
    renderFrames();
  }

  addBtn.onclick = addTab;

  splitBtn.onclick = () => {
    splitMode = !splitMode;
    renderFrames();
  };

  fsBtn.onclick = () => {
    if (!win.document.fullscreenElement) {
      win.document.documentElement.requestFullscreen();
    } else {
      win.document.exitFullscreen();
    }
  };
}
</script>
</body>
</html>
