<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caramel Apple</title>

<style>
:root {
  --bg: #0e1117;
  --panel: #161b22;
  --panel2: #1c222b;
  --accent: #2f81f7;
  --accent-hover: #3b8cff;
  --text: #e6edf3;
  --muted: #8b949e;
  --danger: #ff6b6b;
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

h2 {
  font-weight: 500;
  margin: 20px;
}

button {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid #30363d;
  padding: 6px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #222a35;
}

.topbar {
  padding: 10px;
  background: rgba(22,27,34,0.9);
  backdrop-filter: blur(10px);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid #30363d;
}

input, select {
  background: var(--panel2);
  border: 1px solid #30363d;
  color: var(--text);
  padding: 6px 10px;
  border-radius: var(--radius);
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

.tabs {
  display: flex;
  background: var(--panel);
  overflow-x: auto;
  padding: 6px;
  gap: 6px;
  border-bottom: 1px solid #30363d;
}

.tabs::-webkit-scrollbar {
  height: 6px;
}

.tabs::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 10px;
}

.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--panel2);
  border-radius: var(--radius);
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
}

.tab:hover {
  background: #242c38;
}

.tab.active {
  background: var(--accent);
}

.tab.active:hover {
  background: var(--accent-hover);
}

.tab button {
  background: transparent;
  border: none;
  color: var(--danger);
  font-weight: bold;
  cursor: pointer;
}

.frames {
  position: relative;
  flex: 1;
  background: black;
}

.frames iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.frames iframe.hidden {
  display: none;
}
</style>
</head>

<body>
<h2>Caramel Apple</h2>
<button onclick="openShell()">Open Caramella</button>

<script>
const STORAGE_KEY = "caramelApple_profiles_v1";

function sanitizeUrl(input) {
  try {
    let url = input.trim();
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return new URL(url).href;
  } catch {
    return null;
  }
}

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
  } catch {
    return null;
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function openShell() {
  const win = window.open("about:blank", "_blank");
  if (!win) return alert("Popup blocked");
  win.focus();

  win.document.title = "Caramella";
  win.document.body.innerHTML = "";

  const style = win.document.createElement("style");
  style.textContent = document.querySelector("style").textContent;
  win.document.head.appendChild(style);

  const topbar = win.document.createElement("div");
  topbar.className = "topbar";

  const urlInput = win.document.createElement("input");
  urlInput.placeholder = "Enter URL";

  const titleInput = win.document.createElement("input");
  titleInput.placeholder = "Tab name";

  const profileSelect = win.document.createElement("select");

  const addProfileBtn = win.document.createElement("button");
  addProfileBtn.textContent = "+";

  const addBtn = win.document.createElement("button");
  addBtn.textContent = "Open";

  const fsBtn = win.document.createElement("button");
  fsBtn.textContent = "Fullscreen";

  const tabsBar = win.document.createElement("div");
  tabsBar.className = "tabs";

  const frames = win.document.createElement("div");
  frames.className = "frames";

  win.document.body.append(topbar, tabsBar, frames);
  topbar.append(urlInput, titleInput, profileSelect, addProfileBtn, addBtn, fsBtn);

  let data = loadData() || {
    activeProfile: "default",
    profiles: {
      default: { tabs: [], active: 0 }
    }
  };

  const iframePool = {};

  function getProfile() {
    return data.profiles[data.activeProfile];
  }

  function save() {
    saveData(data);
  }

  function renderProfiles() {
    profileSelect.innerHTML = "";
    Object.keys(data.profiles).forEach(name => {
      const opt = win.document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if (name === data.activeProfile) opt.selected = true;
      profileSelect.appendChild(opt);
    });
  }

  function rebuildTabs() {
    const profile = getProfile();

    profile.tabs = profile.tabs || [];

    profile.tabs.forEach(t => {
      if (!iframePool[t.url]) {
        const frame = win.document.createElement("iframe");
        frame.src = t.url;
        frame.classList.add("hidden");
        frames.appendChild(frame);
        iframePool[t.url] = frame;
      }
      t.frame = iframePool[t.url];
    });
  }

  function renderTabs() {
    const profile = getProfile();
    tabsBar.innerHTML = "";

    profile.tabs.forEach((t, i) => {
      const tab = win.document.createElement("div");
      tab.className = "tab" + (i === profile.active ? " active" : "");
      tab.textContent = t.title;

      tab.onclick = () => switchTab(i);

      const x = win.document.createElement("button");
      x.textContent = "×";
      x.onclick = e => {
        e.stopPropagation();
        closeTab(i);
      };

      tab.appendChild(x);
      tabsBar.appendChild(tab);
    });
  }

  function renderFrames() {
    const profile = getProfile();

    Object.values(iframePool).forEach(f => f.classList.add("hidden"));

    const activeTab = profile.tabs[profile.active];
    if (activeTab && activeTab.frame) {
      activeTab.frame.classList.remove("hidden");
    }
  }

  function switchTab(i) {
    const profile = getProfile();
    profile.active = i;
    save();
    renderTabs();
    renderFrames();
  }

  function closeTab(i) {
    const profile = getProfile();
    profile.tabs.splice(i, 1);
    if (profile.active >= profile.tabs.length) profile.active = profile.tabs.length - 1;
    save();
    renderTabs();
    renderFrames();
  }

  function addTab() {
    const url = sanitizeUrl(urlInput.value);
    if (!url) return win.alert("Invalid URL");

    const profile = getProfile();

    let frame;
    if (iframePool[url]) {
      frame = iframePool[url];
    } else {
      frame = win.document.createElement("iframe");
      frame.src = url;
      frame.classList.add("hidden");
      frames.appendChild(frame);
      iframePool[url] = frame;
    }

    profile.tabs.push({
      title: titleInput.value || new URL(url).hostname,
      url,
      frame
    });

    profile.active = profile.tabs.length - 1;

    save();
    renderTabs();
    renderFrames();
  }

  function switchProfile(name) {
    data.activeProfile = name;
    save();
    rebuildTabs();
    renderTabs();
    renderFrames();
  }

  function addProfile() {
    const name = win.prompt("Profile name?");
    if (!name) return;
    if (data.profiles[name]) return win.alert("Exists");

    data.profiles[name] = { tabs: [], active: 0 };
    data.activeProfile = name;

    save();
    renderProfiles();
    rebuildTabs();
    renderTabs();
    renderFrames();
  }

  profileSelect.onchange = e => switchProfile(e.target.value);
  addProfileBtn.onclick = addProfile;
  addBtn.onclick = addTab;

  fsBtn.onclick = () => {
    if (!win.document.fullscreenElement)
      win.document.documentElement.requestFullscreen();
    else
      win.document.exitFullscreen();
  };

  renderProfiles();
  rebuildTabs();
  renderTabs();
  renderFrames();
}
</script>
</body>
</html>
